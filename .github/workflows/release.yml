name: Release

on:
  push:
    tags:
      # Lowercase "v" only. Plugin Update Checker strips the prefix with
      # ltrim( $tag, 'v' ), which is case-sensitive: a "V2.4.0" tag stays
      # "V2.4.0" and version_compare() ranks it below the installed version,
      # so no update is ever offered.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^= ${VERSION} =/{found=1} found && /^= [0-9]/ && !/^= ${VERSION} =/{exit} found{print}" readme.txt > changelog_body.txt

      # The zip is the asset Plugin Update Checker installs
      # (enableReleaseAssets with REQUIRE_RELEASE_ASSETS in the main plugin file).
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            peeps-people-directory.zip
            readme.txt
          body_path: changelog_body.txt
